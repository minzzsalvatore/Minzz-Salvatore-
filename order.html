<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NikoStore Order</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
NIKO<span>STORE</span>
</div>

</header>



<section class="order-box">


<h1 id="gameName">
Topup Game
</h1>


<label>User ID</label>

<input id="userid" placeholder="Masukkan User ID">



<label>Zone ID</label>

<input id="zoneid" placeholder="Masukkan Zone ID">



<label>Pilih Nominal</label>


<select id="price">


<option value="5">86 Diamond - RM5</option>

<option value="10">172 Diamond - RM10</option>

<option value="20">344 Diamond - RM20</option>

<option value="50">878 Diamond - RM50</option>


</select>



<h2>
Harga:
RM <span id="total">5</span>
</h2>



<button onclick="orderNow()">
ORDER WHATSAPP
</button>


</section>



<script>


let params = new URLSearchParams(window.location.search);

let game = params.get("game");


document.getElementById("gameName").innerHTML =
game || "Topup Game";



let price =
document.getElementById("price");


let total =
document.getElementById("total");



price.onchange=function(){

total.innerHTML=this.value;

}



function orderNow(){


let uid =
document.getElementById("userid").value;


let zone =
document.getElementById("zoneid").value;


let amount =
price.options[price.selectedIndex].text;


if(uid==""){

alert("Sila isi User ID");

return;

}



let message =

`Hello NikoStore%0A%0A`
+
`Game: ${game}%0A`
+
`User ID: ${uid}%0A`
+
`Zone ID: ${zone}%0A`
+
`Produk: ${amount}%0A%0A`
+
`Saya ingin membuat order.`;



window.open(

"https://wa.me/601131209082?text="
+message

);


}


</script>


</body>

</html>
